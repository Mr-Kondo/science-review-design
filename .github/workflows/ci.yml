name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Python version
        run: python --version
      - name: Install, update, uninstall, and safety checks
        run: python -m unittest discover -s tests -v
      - name: Skill package and calculation checks
        run: python -m unittest discover -s .claude/skills/science-review/tests -v
      - name: Execute the README PowerShell example
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $readme = Get-Content -LiteralPath README.md -Raw -Encoding utf8
          $pattern = '(?s)<!-- docs-smoke:start -->\s*```powershell\r?\n(.*?)```\s*<!-- docs-smoke:end -->'
          $block = [regex]::Match($readme, $pattern)
          if (-not $block.Success) { throw 'README PowerShell example is missing' }
          & ([scriptblock]::Create($block.Groups[1].Value))
